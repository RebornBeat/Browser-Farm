[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-farm"
version = "0.2.4"  # Bumped version for DB integration
description = "A distributed browser automation platform for developers. Manage multiple browser contexts across multiple servers with live monitoring, manual control, and custom scripts."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "playwright>=1.41.0",
    "psutil>=5.9.8",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "websockets>=12.0",
    "aiofiles>=23.2.1",
    "pillow>=10.2.0",
    "aiohttp>=3.9.0",  # Added for Shared State API helpers

    # --- Database Dependencies ---
    "sqlalchemy[asyncio]>=2.0.0", # ORM with async support
    "asyncpg>=0.29.0",            # PostgreSQL async driver
    "greenlet>=3.0.0",            # Required for SQLAlchemy async context
]

# This creates the "browser-farm" command line tool
[project.scripts]
browser-farm = "browser_farm.server:main"

[project.urls]
Homepage = "https://github.com/RebornBeat/Browser-Farm"

# --- CRITICAL PACKAGE MAPPING ---
[tool.setuptools]
packages = ["browser_farm"]
include-package-data = true

[tool.setuptools.package-dir]
# This tells pip: "The package 'browser_farm' is located in the 'src' folder"
browser_farm = "src"
